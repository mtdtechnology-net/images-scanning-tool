[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "numpy>=1.24.0",
    "opencv-contrib-python>=4.10.0.84",
    "paddleocr>=3.7.0,<3.8",
    # Local dev (macOS) runs OCR on CPU; the Linux server runs it on the RTX 5060 Ti
    # (Blackwell / sm_120), which needs the CUDA 12.9 build from Paddle's own index.
    "paddlepaddle==3.3.1; sys_platform == 'darwin'",
    "paddlepaddle-gpu==3.3.1; sys_platform == 'linux'",
    # CUDA runtime libs required by paddlepaddle-gpu. Its wheel declares them, but Paddle's
    # index serves no separate metadata, so uv misses them; pinned to the wheel's own versions.
    "nvidia-cuda-nvrtc-cu12==12.9.41; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.9.37; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.9.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.9.0.52; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas-cu12==12.9.0.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.4.0.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.10.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.4.40; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.9.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.27.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.9.19; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.9.41; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cufile-cu12==1.14.0.30; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cuda-python==12.9.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-cccl-cu12==12.9.27; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pypdfium2>=4.0.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.9",
    "setuptools",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129", marker = "sys_platform == 'linux'" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
